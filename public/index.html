<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#13202e" />
    <meta name="description" content="Agenda de eventos deportivos: natación, atletismo, ciclismo, karate y CrossFit para adultos y niños." />
    <title>EventPass · Agenda deportiva</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2313202e'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='14' fill='%23ffc914' text-anchor='middle'%3EEP%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,700;1,400&family=Big+Shoulders+Display:wght@600;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/js/config.js"></script>
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <a class="saltar" href="#contenido">Saltar al contenido</a>
    <header class="barra">
      <a class="marca" href="#/" aria-label="EventPass, inicio">
        <span class="marca-dorsal" aria-hidden="true">EP</span>
        <span>EventPass</span>
      </a>
      <nav class="nav" id="nav" aria-label="Navegación principal"></nav>
    </header>

    <main id="contenido" tabindex="-1"></main>

    <footer class="pie">
      <p>EventPass · Agenda deportiva de Santander</p>
      <p>Las inscripciones, cupos y avisos se gestionan con n8n.</p>
    </footer>

    <div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>

    <section class="chat" id="chat" aria-label="Asistente de EventPass">
      <button class="chat-abrir" id="chat-abrir" type="button" aria-expanded="false" aria-controls="chat-panel">
        ¿Dudas? Pregúntale al asistente
      </button>
      <div class="chat-panel" id="chat-panel" hidden>
        <header class="chat-cabecera">
          <div>
            <h2>Asistente EventPass</h2>
            <p>Responde sobre eventos, cupos y cómo inscribirte. No hace inscripciones por ti.</p>
          </div>
          <button class="chat-cerrar" id="chat-cerrar" type="button" aria-label="Cerrar asistente">×</button>
        </header>
        <ol class="chat-mensajes" id="chat-mensajes" aria-live="polite"></ol>
        <form class="chat-form" id="chat-form">
          <label class="oculto" for="chat-texto">Escribe tu pregunta</label>
          <input id="chat-texto" name="texto" autocomplete="off" maxlength="500" placeholder="¿Qué eventos hay para niños?" required />
          <button class="boton boton-senal" type="submit">Enviar</button>
        </form>
      </div>
    </section>
  </body>
</html>
